<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skylight Photos</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
        opacity: 0; transition: opacity 1.5s ease; }
  img.bg { object-fit: cover; filter: blur(30px) brightness(.5); transform: scale(1.1); }
  img.show { opacity: 1; }
  #clock { position: absolute; left: 32px; bottom: 24px; color: #fff; font: 700 64px/1 sans-serif;
           text-shadow: 0 2px 12px rgba(0,0,0,.6); }
  #date { font-size: 24px; font-weight: 500; margin-top: 6px; }
</style>
</head>
<body>
<img id="bg" class="bg"><img id="a"><img id="b">
<div id="clock"><span id="time"></span><div id="date"></div></div>
<script>
// Photos listed in photos.json (same folder): ["photos/1.jpg", "photos/2.jpg", ...]
const INTERVAL_MS = 15000;
let photos = [], i = 0, front = document.getElementById('a'), back = document.getElementById('b');
const bg = document.getElementById('bg');

function tick() {
  const d = new Date();
  document.getElementById('time').textContent =
    d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  document.getElementById('date').textContent =
    d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
}

function next() {
  if (!photos.length) return;
  const src = photos[i++ % photos.length];
  back.onload = () => {
    back.classList.add('show'); front.classList.remove('show');
    bg.src = src; bg.classList.add('show');
    [front, back] = [back, front];
  };
  back.src = src;
}

fetch('photos.json?' + Date.now()).then(r => r.json()).then(list => {
  photos = list.sort(() => Math.random() - 0.5);
  next(); setInterval(next, INTERVAL_MS);
}).catch(() => { document.getElementById('date').textContent = 'Add photos to www/skylight/photos.json'; });

tick(); setInterval(tick, 10000);
</script>
</body>
</html>
