name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly, to catch new Home Assistant releases
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Home Assistant (hassfest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    # HACS can only read public repositories; this check runs once the repo is made public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # The icon lives in the home-assistant/brands repo; not submitted yet.
          ignore: brands

  pytest:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install pytest-homeassistant-custom-component home-assistant-frontend ical respx aiomealie
      - run: pytest -q

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
