name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly, to catch new Home Assistant releases
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Home Assistant (hassfest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    # HACS can only read public repositories; this check runs once the repo is made public.
    if: ${{ github.event_name != 'schedule' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # The icon lives in the home-assistant/brands repo; not submitted yet.
          ignore: brands

  pytest:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14" # the HA test plugin requires 3.14 to track current Home Assistant releases
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install pytest-homeassistant-custom-component home-assistant-frontend ical respx aiomealie gcal_sync # gcal_sync: the Google calendar library the free/busy tests build events with
      - run: pytest -q

  e2e:
    name: Browser tests
    # Pinned: ubuntu-latest moved to 26.04 in Oct 2026 and Playwright's browser installer doesn't support it yet.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
