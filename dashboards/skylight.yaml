# Skylight replica dashboard (YAML mode).
# Required HACS frontend cards:
#   - week-planner-card   (https://github.com/FamousWolf/week-planner-card)
#   - mushroom            (https://github.com/piitaya/lovelace-mushroom)
#   - card-mod            (https://github.com/thomasloven/lovelace-card-mod)
#   - kiosk-mode          (https://github.com/NemesisRE/kiosk-mode)
#
# Replace entity IDs:
#   calendar.alex / jordan / sam / riley / family  -> your calendars
#   weather.home                                    -> your weather entity
#   todo.chores_<name>, todo.groceries, todo.family_todo -> Local To-do lists
#   media_source path for photos                    -> see README

kiosk_mode:
  hide_header: true
  hide_sidebar: true
  admin_settings:
    hide_header: false
    hide_sidebar: false

title: Skylight
views:
  # ---------------------------------------------------------------- CALENDAR
  - title: Calendar
    path: calendar
    icon: mdi:calendar-month
    theme: Skylight
    type: panel
    cards:
      - type: vertical-stack
        cards:
          # Header: big clock + date + weather + family chips
          - type: grid
            columns: 3
            square: false
            cards:
              - type: markdown
                card_mod:
                  style: |
                    ha-card { background: none; box-shadow: none; }
                    ha-markdown { padding: 8px 16px !important; }
                    h1 { font-size: 56px; margin: 0; font-weight: 800; line-height: 1; }
                    h3 { margin: 4px 0 0; font-weight: 600; color: var(--secondary-text-color); }
                content: |
                  # {{ now().strftime('%-I:%M') }}
                  ### {{ now().strftime('%A, %B %-d') }}
              - type: custom:mushroom-chips-card
                alignment: center
                card_mod:
                  style: |
                    ha-card { padding-top: 22px; }
                chips:
                  - type: template
                    content: Everyone
                    icon: mdi:account-group
                    icon_color: orange
                    tap_action:
                      action: perform-action
                      perform_action: input_select.select_option
                      target: { entity_id: input_select.skylight_member_filter }
                      data: { option: Everyone }
                  - type: template
                    content: Alex
                    icon: mdi:account
                    icon_color: red
                    tap_action:
                      action: perform-action
                      perform_action: input_select.select_option
                      target: { entity_id: input_select.skylight_member_filter }
                      data: { option: Alex }
                  - type: template
                    content: Jordan
                    icon: mdi:account
                    icon_color: blue
                    tap_action:
                      action: perform-action
                      perform_action: input_select.select_option
                      target: { entity_id: input_select.skylight_member_filter }
                      data: { option: Jordan }
                  - type: template
                    content: Sam
                    icon: mdi:account
                    icon_color: green
                    tap_action:
                      action: perform-action
                      perform_action: input_select.select_option
                      target: { entity_id: input_select.skylight_member_filter }
                      data: { option: Sam }
                  - type: template
                    content: Riley
                    icon: mdi:account
                    icon_color: purple
                    tap_action:
                      action: perform-action
                      perform_action: input_select.select_option
                      target: { entity_id: input_select.skylight_member_filter }
                      data: { option: Riley }
              - type: custom:mushroom-template-card
                entity: weather.home
                primary: "{{ state_attr('weather.home','temperature') | round(0) }}°"
                secondary: "{{ states('weather.home') | replace('-', ' ') | title }}"
                icon: >
                  {% set s = states('weather.home') %}
                  {{ {'sunny':'mdi:weather-sunny','clear-night':'mdi:weather-night',
                      'partlycloudy':'mdi:weather-partly-cloudy','cloudy':'mdi:weather-cloudy',
                      'rainy':'mdi:weather-rainy','pouring':'mdi:weather-pouring',
                      'snowy':'mdi:weather-snowy','lightning':'mdi:weather-lightning',
                      'fog':'mdi:weather-fog','windy':'mdi:weather-windy'}.get(s, 'mdi:weather-cloudy') }}
                icon_color: amber
                layout: horizontal
                fill_container: true
                card_mod:
                  style: |
                    ha-card { background: none; box-shadow: none; justify-content: flex-end; }
                    .primary { font-size: 32px !important; }

          # Everyone: all calendars, color-coded (the Skylight week view)
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.skylight_member_filter
                state: Everyone
            card:
              type: custom:week-planner-card
              days: 7
              startingDay: today
              showNavigation: true
              compact: false
              noCardBackground: false
              hideWeekend: false
              locale: en
              weather:
                entity: weather.home
                showCondition: true
                showTemperature: true
              calendars:
                - entity: calendar.family
                  color: "#ff9f43"
                  name: Family
                - entity: calendar.alex
                  color: "#ff6b6b"
                  name: Alex
                - entity: calendar.jordan
                  color: "#4a7dff"
                  name: Jordan
                - entity: calendar.sam
                  color: "#2ecc71"
                  name: Sam
                - entity: calendar.riley
                  color: "#a66bff"
                  name: Riley
              card_mod:
                style: |
                  ha-card { min-height: 78vh; }

          # Per-member filtered views
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.skylight_member_filter
                state: Alex
            card:
              type: custom:week-planner-card
              days: 7
              startingDay: today
              showNavigation: true
              calendars:
                - { entity: calendar.alex, color: "#ff6b6b", name: Alex }
                - { entity: calendar.family, color: "#ff9f43", name: Family }
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.skylight_member_filter
                state: Jordan
            card:
              type: custom:week-planner-card
              days: 7
              startingDay: today
              showNavigation: true
              calendars:
                - { entity: calendar.jordan, color: "#4a7dff", name: Jordan }
                - { entity: calendar.family, color: "#ff9f43", name: Family }
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.skylight_member_filter
                state: Sam
            card:
              type: custom:week-planner-card
              days: 7
              startingDay: today
              showNavigation: true
              calendars:
                - { entity: calendar.sam, color: "#2ecc71", name: Sam }
                - { entity: calendar.family, color: "#ff9f43", name: Family }
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.skylight_member_filter
                state: Riley
            card:
              type: custom:week-planner-card
              days: 7
              startingDay: today
              showNavigation: true
              calendars:
                - { entity: calendar.riley, color: "#a66bff", name: Riley }
                - { entity: calendar.family, color: "#ff9f43", name: Family }

  # ---------------------------------------------------------------- CHORES
  - title: Chores
    path: chores
    icon: mdi:checkbox-marked-circle-outline
    theme: Skylight
    type: masonry
    cards:
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-entity-card
            entity: counter.stars_alex
            name: Alex
            icon: mdi:star
            icon_color: red
            layout: vertical
            tap_action: { action: perform-action, perform_action: counter.increment, target: { entity_id: counter.stars_alex } }
            hold_action: { action: perform-action, perform_action: counter.decrement, target: { entity_id: counter.stars_alex } }
          - type: custom:mushroom-entity-card
            entity: counter.stars_jordan
            name: Jordan
            icon: mdi:star
            icon_color: blue
            layout: vertical
            tap_action: { action: perform-action, perform_action: counter.increment, target: { entity_id: counter.stars_jordan } }
            hold_action: { action: perform-action, perform_action: counter.decrement, target: { entity_id: counter.stars_jordan } }
          - type: custom:mushroom-entity-card
            entity: counter.stars_sam
            name: Sam
            icon: mdi:star
            icon_color: green
            layout: vertical
            tap_action: { action: perform-action, perform_action: counter.increment, target: { entity_id: counter.stars_sam } }
            hold_action: { action: perform-action, perform_action: counter.decrement, target: { entity_id: counter.stars_sam } }
          - type: custom:mushroom-entity-card
            entity: counter.stars_riley
            name: Riley
            icon: mdi:star
            icon_color: purple
            layout: vertical
            tap_action: { action: perform-action, perform_action: counter.increment, target: { entity_id: counter.stars_riley } }
            hold_action: { action: perform-action, perform_action: counter.decrement, target: { entity_id: counter.stars_riley } }
      - type: todo-list
        entity: todo.chores_alex
        title: Alex
        card_mod: { style: "ha-card { border-top: 6px solid #ff6b6b; }" }
      - type: todo-list
        entity: todo.chores_jordan
        title: Jordan
        card_mod: { style: "ha-card { border-top: 6px solid #4a7dff; }" }
      - type: todo-list
        entity: todo.chores_sam
        title: Sam
        card_mod: { style: "ha-card { border-top: 6px solid #2ecc71; }" }
      - type: todo-list
        entity: todo.chores_riley
        title: Riley
        card_mod: { style: "ha-card { border-top: 6px solid #a66bff; }" }
      - type: markdown
        title: Rewards
        content: |
          Goal: **{{ states('input_number.skylight_reward_goal') | int }} ⭐**

          {% for p in ['alex','jordan','sam','riley'] %}
          {%- set s = states('counter.stars_' ~ p) | int(0) %}
          {%- set g = states('input_number.skylight_reward_goal') | int(25) %}
          **{{ p | title }}** — {{ s }} / {{ g }} {{ '🏆 Reward earned!' if s >= g else '' }}
          {% endfor %}
      - type: entities
        title: Rewards settings
        entities:
          - input_number.skylight_reward_goal
          - script.skylight_reset_stars

  # ---------------------------------------------------------------- MEALS
  - title: Meals
    path: meals
    icon: mdi:silverware-fork-knife
    theme: Skylight
    type: masonry
    cards:
      - type: custom:week-planner-card
        title: Meal Plan
        days: 7
        startingDay: today
        calendars:
          - entity: calendar.meals
            color: "#ff9f43"
            name: Meals
      - type: entities
        title: Today's Menu
        entities:
          - input_text.meal_breakfast
          - input_text.meal_lunch
          - input_text.meal_dinner
          - input_text.meal_snack

  # ---------------------------------------------------------------- LISTS
  - title: Lists
    path: lists
    icon: mdi:format-list-checks
    theme: Skylight
    type: masonry
    cards:
      - type: todo-list
        entity: todo.groceries
        title: Groceries
      - type: todo-list
        entity: todo.family_todo
        title: To Do

  # ---------------------------------------------------------------- PHOTOS
  # Full-screen photo frame. Fully Kiosk's screensaver can also point here:
  #   Screensaver URL: http://<ha>:8123/skylight-dashboard/photos
  - title: Photos
    path: photos
    icon: mdi:image-multiple
    theme: Skylight
    type: panel
    cards:
      - type: iframe
        url: /local/skylight/slideshow.html
        aspect_ratio: 56%
        card_mod:
          style: |
            ha-card { height: 100vh !important; padding: 0 !important; border-radius: 0; }
            #root { height: 100vh !important; padding-top: 0 !important; }
