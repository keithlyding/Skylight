# Skylight replica - helpers, scripts and automations.
# Enable packages in configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named packages
#
# Rename the family members (alex, jordan, sam, riley) to match your household.
# Use find/replace across this file AND dashboards/skylight.yaml.

counter:
  stars_alex:
    name: Alex Stars
    icon: mdi:star
    step: 1
    minimum: 0
    restore: true
  stars_jordan:
    name: Jordan Stars
    icon: mdi:star
    step: 1
    minimum: 0
    restore: true
  stars_sam:
    name: Sam Stars
    icon: mdi:star
    step: 1
    minimum: 0
    restore: true
  stars_riley:
    name: Riley Stars
    icon: mdi:star
    step: 1
    minimum: 0
    restore: true

input_number:
  skylight_reward_goal:
    name: Reward Goal (stars)
    min: 5
    max: 100
    step: 5
    initial: 25
    mode: box
    icon: mdi:trophy

input_boolean:
  skylight_night_mode:
    name: Skylight Night Mode
    icon: mdi:weather-night

input_select:
  skylight_member_filter:
    name: Calendar Filter
    icon: mdi:account-filter
    options:
      - Everyone
      - Alex
      - Jordan
      - Sam
      - Riley

# Tonight's dinner, shown on the Home view. Edit from the Meals view.
input_text:
  meal_breakfast:
    name: Breakfast
    max: 100
  meal_lunch:
    name: Lunch
    max: 100
  meal_dinner:
    name: Dinner
    max: 100
  meal_snack:
    name: Snack
    max: 100

script:
  skylight_award_star:
    alias: Award a star
    icon: mdi:star-plus
    fields:
      member:
        description: counter entity to increment
        example: counter.stars_alex
        required: true
        selector:
          entity:
            domain: counter
    sequence:
      - action: counter.increment
        target:
          entity_id: "{{ member }}"

  skylight_complete_chore:
    alias: Complete chore and award star
    icon: mdi:check-circle
    fields:
      todo_entity:
        required: true
        selector:
          entity:
            domain: todo
      item:
        required: true
        selector:
          text:
      member:
        required: true
        selector:
          entity:
            domain: counter
    sequence:
      - action: todo.update_item
        target:
          entity_id: "{{ todo_entity }}"
        data:
          item: "{{ item }}"
          status: completed
      - action: counter.increment
        target:
          entity_id: "{{ member }}"

  skylight_reset_stars:
    alias: Reset all stars
    icon: mdi:restart
    sequence:
      - action: counter.reset
        target:
          entity_id:
            - counter.stars_alex
            - counter.stars_jordan
            - counter.stars_sam
            - counter.stars_riley

automation:
  # Award a star whenever an item on a member's chore list is checked off.
  - id: skylight_star_on_chore_complete
    alias: Skylight - award star on chore completion
    mode: queued
    triggers:
      - trigger: state
        entity_id:
          - todo.chores_alex
          - todo.chores_jordan
          - todo.chores_sam
          - todo.chores_riley
    conditions:
      # todo state = number of incomplete items; a drop means one was completed.
      # Caveat: deleting an unchecked item also drops the count and awards a star.
      - condition: template
        value_template: >
          {{ trigger.from_state is not none
             and trigger.from_state.state | is_number
             and trigger.to_state.state | is_number
             and trigger.to_state.state | int < trigger.from_state.state | int }}
    actions:
      - action: counter.increment
        target:
          entity_id: "counter.stars_{{ trigger.entity_id.split('chores_')[1] }}"

  # Uncheck recurring daily chores every morning at 4am.
  - id: skylight_reset_daily_chores
    alias: Skylight - reset daily chores (uncheck completed)
    triggers:
      - trigger: time
        at: "04:00:00"
    variables:
      lists:
        - todo.chores_alex
        - todo.chores_jordan
        - todo.chores_sam
        - todo.chores_riley
    actions:
      - action: todo.get_items
        target:
          entity_id: "{{ lists }}"
        data:
          status: completed
        response_variable: done
      - repeat:
          for_each: >
            {% set ns = namespace(out=[]) %}
            {% for list_id in lists %}
              {% for i in done[list_id]['items'] %}
                {% set ns.out = ns.out + [{'list': list_id, 'item': i.summary}] %}
              {% endfor %}
            {% endfor %}
            {{ ns.out }}
          sequence:
            - action: todo.update_item
              target:
                entity_id: "{{ repeat.item.list }}"
              data:
                item: "{{ repeat.item.item }}"
                status: needs_action

  # Night mode: dim/turn off the tablet screen (requires Fully Kiosk Browser integration).
  - id: skylight_night_on
    alias: Skylight - night mode on
    triggers:
      - trigger: time
        at: "21:30:00"
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.skylight_night_mode
      - action: switch.turn_off
        target:
          entity_id: switch.skylight_tablet_screen
        continue_on_error: true

  - id: skylight_night_off
    alias: Skylight - night mode off
    triggers:
      - trigger: time
        at: "06:30:00"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.skylight_night_mode
      - action: switch.turn_on
        target:
          entity_id: switch.skylight_tablet_screen
        continue_on_error: true
      - action: number.set_value
        target:
          entity_id: number.skylight_tablet_screen_brightness
        data:
          value: 200
        continue_on_error: true
